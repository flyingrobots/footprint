name: Release

# A tag `vX.Y.Z` on main releases @flyingrobots/footprint: sanity checks, a GitHub release carrying
# the tarball, then a staged publish to npm through OIDC trusted publishing (no token in the
# repository). The staged version is installable only after the owner approves it. The package version moves on its own; a release publishes the schema versions the
# changelog names, never a schema version of its own. See docs/workflows/release/README.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite runs the CLI against HEAD~1..HEAD and origin/main; see ci.yml.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # graft, the optional structural dependency, runs on node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "version $TAG_VERSION"

      - name: Verify the changelog has a dated heading for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[${TAG_VERSION//./\\.}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated heading for $TAG_VERSION"; exit 1; }

      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Verify package.json has the publishing fields
        run: |
          bun -e "
            const pkg = JSON.parse(await Bun.file('package.json').text());
            const required = ['name', 'version', 'description', 'license', 'repository', 'bin', 'files', 'engines', 'publishConfig'];
            const missing = required.filter((f) => !pkg[f]);
            if (missing.length) { console.error('missing package.json fields:', missing.join(', ')); process.exit(1); }
            if (!pkg.files.length) { console.error('files is empty'); process.exit(1); }
            if (pkg.publishConfig.access !== 'public') { console.error('publishConfig.access must be public'); process.exit(1); }
            console.log('package.json fields present');
          "

      - name: Install zsh
        # test/skill.test.ts runs the skill's commands under bash and zsh
        # (flyingrobots/footprint#37); ubuntu-latest ships bash only.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - run: bun install --frozen-lockfile

      - name: Run the gate
        env:
          # The same five variables as ci.yml, for the same reason; see docs/workflows/ci/README.md.
          FOOTPRINT_REQUIRE_GRAFT: "1"
          GIT_AUTHOR_NAME: "footprint-ci"
          GIT_AUTHOR_EMAIL: "footprint-ci@example.invalid"
          GIT_COMMITTER_NAME: "footprint-ci"
          GIT_COMMITTER_EMAIL: "footprint-ci@example.invalid"
        run: bun test

      - name: Verify the pack contents
        run: npm pack --dry-run

      # flyingrobots/footprint#35: npm normalizes package.json at publish time and drops what it
      # considers invalid with only a warning (at v0.3.0, `bin.footprint`). Fail instead: with the
      # same npm the publish job uses, `npm pkg fix` must change no field and a publish dry run
      # must report no correction. See docs/workflows/release/README.md.
      - name: Verify npm would publish the manifest unchanged
        run: bun scripts/manifest-check.ts --npm "npx -y npm@latest"

  release:
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the version and its changelog section
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next} /^## \[/ {if (found) exit} found {print}' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release @flyingrobots/footprint $VERSION" > release-notes.md

      - name: Build the release tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          (cd release-assets && sha256sum -- *.tgz > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@flyingrobots/footprint ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/*.tgz release-assets/SHA256SUMS

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The trusted publisher on npmjs.com allows `npm stage publish` only (flyingrobots/footprint#61):
      # this stages the version, and the owner approves it with two-factor authentication. Staging
      # needs npm 11.15.0 or later.
      - name: Stage on npm with OIDC provenance; the owner approves
        run: npx -y npm@latest stage publish --access public --provenance
