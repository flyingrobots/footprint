name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # test/cli.test.ts runs the CLI against HEAD~1..HEAD and against origin/main as a
          # three-dot range; a shallow (depth-1) checkout has neither, so the suite needs full
          # history.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install zsh
        # test/skill.test.ts runs the skill's commands under bash and zsh
        # (flyingrobots/footprint#37); ubuntu-latest ships bash only.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the gate
        env:
          # flyingrobots/footprint#25: fail loudly, not quietly, when graft is expected to answer
          # and does not. test/require-graft.test.ts only asserts anything when this is set.
          FOOTPRINT_REQUIRE_GRAFT: "1"
          # graft writes its own lazy WARP index as git objects in the repository it reads
          # (`git commit-tree`, by way of `@git-stunts/plumbing`), and that plumbing layer strips
          # the environment it hands to its own git subprocesses down to a short whitelist that
          # does not include HOME -- so git has no `~/.gitconfig` to read an identity from. On
          # ubuntu-latest's runner user, git's own fallback identity construction then fails and
          # `commit-tree` exits 128, which graft reports up as "Git command failed with code
          # 128" and footprint records as `graft.exports_failed`: installed, but silent. These
          # four are the identity variables that whitelist does carry through, so setting them is
          # what lets graft answer. See docs/workflows/ci/README.md.
          GIT_AUTHOR_NAME: "footprint-ci"
          GIT_AUTHOR_EMAIL: "footprint-ci@example.invalid"
          GIT_COMMITTER_NAME: "footprint-ci"
          GIT_COMMITTER_EMAIL: "footprint-ci@example.invalid"
        run: bun test
